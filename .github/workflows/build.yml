name: Build Kwebbel Multi-Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # We use a real runner for each OS to handle CGO correctly
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # --- INSTALL C LIBRARIES FOR OPUS/ALSA ---
      
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libopus-dev pkg-config

      - name: Install macOS Dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install opus pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix opus)/lib/pkgconfig" >> $GITHUB_ENV

      # Windows-latest already has MinGW/GCC installed in the environment!

      # --- BUILD ---

      - name: Build Binary (Unix)
        if: matrix.os == 'ubuntu-latest'
        run: |
          export CGO_ENABLED=1
          go build -v -ldflags="-s -w" -o kwebbel-${{ matrix.os }} ./main-cli.go

      - name: Build Binary (Mac)
        if: matrix.os == 'macos-latest'
        run: |
          # Use the environment variable set above
          CGO_ENABLED=1 go build -v -x ./main-cli.go

      - name: Build Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $env:CGO_ENABLED="1"
          go build -v -ldflags="-s -w" -o kwebbel-windows.exe ./main-cli.go

      # --- UPLOAD ---

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kwebbel-${{ matrix.os }}
          path: |
            kwebbel-ubuntu-latest
            kwebbel-macos-latest
            kwebbel-windows.exe
          retention-days: 5